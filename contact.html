<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #a56066;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #4b2e6b;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-weight: bold;
        }

        .container {
            width: 60%;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            box-shadow: 0 0 10px gray;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            background-color: #1abc9c;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
        }

        button:hover {
            background-color: #159a80;
        }

        footer {
            text-align: center;
            background-color: #243447;
            color: white;
            padding: 15px;
        }
    </style>

<body>

<header>
    <h1>Contact Me</h1>
</header>

<nav>
    <a href="index.html">Resume</a>

    <a href="contact.html">Contact</a>
</nav>

<div class="container">

    <form onsubmit="showMessage(); return false;">

        <label>Name:</label>
        <input type="text" id="name" required>

        <label>Email:</label>
        <input type="email" id="email" required>

        <label>Message:</label>
        <textarea id="message" rows="5" required></textarea>

        <button type="submit">Submit</button>

    </form>

</div>

    }
